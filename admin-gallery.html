<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery Admin | YouR Party Rentals LLC</title><meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><header class="site-header"><div class="brand-wrap"><div id="logo-fallback" class="logo-fallback"><span class="wordmark">YouR</span><small>PARTY RENTALS LLC</small></div></div><nav class="site-nav"><a href="index.html">Back to Site</a></nav></header><main><section id="admin-login" class="booking reveal"><h2>Gallery Admin Login</h2><form id="admin-login-form" class="booking-form"><label>Admin Username<input type="text" name="username" required autocomplete="username"></label><label>Admin Password<input type="password" name="password" required autocomplete="current-password"></label><button class="submit-btn" type="submit">Log In</button><p id="login-status"></p></form></section><section id="admin-panel" class="booking reveal" hidden><div class="booking-head"><h2>Manage Gallery Images</h2><button id="logout-btn" type="button">Log Out</button></div><form id="upload-form" class="booking-form"><label>Upload Image<input type="file" name="image" accept="image/*" required></label><label>Caption<input type="text" name="caption"></label><button class="submit-btn" type="submit">Add to Gallery</button><p id="upload-status"></p></form><div id="admin-gallery-grid" class="gallery-grid"></div><section class="admin-settings"><h2>Business Settings</h2><form id="settings-form" class="booking-form"><label>Account Holder<input name="accountHolder"></label><label>Bank Name<input name="bankName"></label><label>Account Number<input name="accountNumber"></label><label>Routing Number<input name="routingNumber"></label><label>Notification Email<input type="email" name="notificationEmail"></label><label>Notification Phone<input name="notificationPhone"></label><button class="submit-btn" type="submit">Save Business Settings</button><p id="settings-status"></p></form><form id="availability-form" class="booking-form"><h3>Drop-off Time Slots</h3><label>Date<input type="date" name="availabilityDate" required></label><label>Times<input name="availabilitySlots" placeholder="08:00, 10:00, 12:00, 14:00, 16:00, 18:00"></label><button class="submit-btn" type="submit">Save Date Availability</button><p id="availability-status"></p></form><form id="catalog-form" class="booking-form"><h3>Inventory &amp; Prices</h3><div id="inventory-editor" class="inventory-editor"></div><h3>Booking Packages</h3><div id="package-editor" class="package-editor"></div><button id="add-package-btn" type="button">Add Package</button><button class="submit-btn" type="submit">Save Inventory &amp; Packages</button><p id="catalog-status"></p></form></section></section></main><div id="preview-modal" class="preview-modal" hidden><div class="preview-dialog"><button id="close-preview-btn" type="button">Close</button><h2 id="preview-title">Image Preview</h2><img id="preview-image" src="" alt=""><p id="preview-caption"></p></div></div><script src="admin-gallery.js"></script><script src="admin-auth.js"></script></body></html>
